name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # 固件：用标准 RISC-V GCC 对两端固件（Probe / Dongle）做编译校验。
  # 说明：最终链接需 WCH 专有库 libCH57xRF.a / libISP572.a（不在仓库内，
  #       随官方 CH57x EVT/SDK 分发），故 CI 只校验「全部翻译单元编译通过」，
  #       不产出 .hex。要生成可烧录 .hex 请用 MounRiver Studio（见 readme）。
  # ------------------------------------------------------------------
  firmware:
    name: firmware (compile-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download xPack riscv-none-elf-gcc (linux-x64)
        run: |
          set -euo pipefail
          VER=14.2.0-2
          URL="https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${VER}/xpack-riscv-none-elf-gcc-${VER}-linux-x64.tar.gz"
          mkdir -p tools
          curl -L --retry 3 --retry-delay 2 -o /tmp/riscv.tar.gz "$URL"
          tar -xzf /tmp/riscv.tar.gz -C tools
          test -x "tools/xpack-riscv-none-elf-gcc-${VER}/bin/riscv-none-elf-gcc"
          "tools/xpack-riscv-none-elf-gcc-${VER}/bin/riscv-none-elf-gcc" --version | head -1

      - name: Compile-check RF_Uart (Probe) & RF_UartDongle (Dongle)
        run: bash tools/build_linux.sh

  # ------------------------------------------------------------------
  # Windows 上位机 (app_win)：MSVC x64 Release -> CH570_Monitor.exe
  # ------------------------------------------------------------------
  app-win:
    name: app_win (windows x64)
    # 钉定 windows-2022：该镜像确定含 VS2022(v17)，与下方 "Visual Studio 17 2022" 生成器精确匹配；
    # windows-latest 可能指向不含 v17 实例的新镜像，导致 CMake 配置阶段报“could not find any instance of Visual Studio”。
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure & build (Visual Studio 2022, x64 Release)
        working-directory: app_win
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release

      - name: Upload CH570_Monitor.exe
        uses: actions/upload-artifact@v4
        with:
          name: CH570_Monitor-windows-x64
          path: app_win/build/Release/CH570_Monitor.exe

  # ------------------------------------------------------------------
  # Linux 上位机 (app_linux/ch570mon)：x64 + aarch64（原生 ARM runner）
  # ------------------------------------------------------------------
  app-linux:
    name: app_linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ncurses (wide-char) + pkg-config
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libncurses-dev libncursesw5-dev \
            || sudo apt-get install -y pkg-config libncurses-dev

      - name: Build ch570mon
        working-directory: app_linux
        run: make

      - name: Upload ch570mon (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: ch570mon-linux-${{ matrix.arch }}
          path: app_linux/ch570mon

  # ------------------------------------------------------------------
  # Android BLE monitor: build both debug and release APKs.
  # ------------------------------------------------------------------
  app-android:
    name: app_android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug and release APKs
        working-directory: app_android
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: CH570_Monitor-android
          path: |
            app_android/app/build/outputs/apk/debug/app-debug.apk
            app_android/app/build/outputs/apk/release/app-release.apk

  release:
    name: release bundle
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, app-win, app-linux, app-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CH570_Monitor-windows-x64
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: ch570mon-linux-x64
          path: release/linux/x64
      - uses: actions/download-artifact@v4
        with:
          name: ch570mon-linux-aarch64
          path: release/linux/aarch64
      - uses: actions/download-artifact@v4
        with:
          name: CH570_Monitor-android
          path: release/android
      - name: Create release archive
        run: |
          mkdir -p release/package
          cp release/firmware/*.hex release/package/
          cp release/windows/CH570_Monitor.exe release/package/
          cp release/android/*.apk release/package/
          cp release/linux/x64/ch570mon release/package/ch570mon-linux-x64
          cp release/linux/aarch64/ch570mon release/package/ch570mon-linux-aarch64
          tar -czf "CH570-wireless-serial-${GITHUB_REF_NAME}.tar.gz" -C release/package .
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            CH570-wireless-serial-${{ github.ref_name }}.tar.gz
            release/package/*
